# ============================================
# pytest 配置文件
# ============================================

[pytest]
# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 输出配置
addopts = -v --tb=short

# 标记
markers =
    slow: 慢速测试（需要 API 调用）
    integration: 集成测试
    unit: 单元测试

# 路径配置
testpaths = tests
