# CI for llm-agent-projects
#
# Two notes on what this file is, because both cost time otherwise.
#
# 1. The first draft of this workflow was rejected by GitHub before it ran a single
#    step: `run: echo "Project ... status: ${{ job.status }}"` is a plain scalar whose
#    value contains ": ", so YAML reads it as a mapping. The run showed as failed with
#    zero jobs, which looks exactly like a broken test.
#
# 2. `compileall || echo warning` and `pytest || echo warning` made the gate
#    unpassable in both directions — any broken sub-project still gave a green badge.
#    Thirteen of the seventeen sub-projects do have failing tests today, so the gate
#    compares each one against results/baseline.txt instead: a sub-project that is new
#    and failing, or that regressed from green to red, fails the build. Changing the
#    baseline is a deliberate act and shows up in the diff.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Compile-check every sub-project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile
        shell: bash
        run: |
          set -uo pipefail
          failed=""
          for proj in 01-rag-knowledge-base 02-agent-workflow 03-multi-model-gateway \
                     04-guardrails-chat 05-vector-db-manager 06-lora-finetune \
                     07-code-review-agent 09-multimodal-doc-understanding \
                     11-dify-workflow 12-prompt-eval-framework \
                     14-mcp-tool-integration 15-agent-security-sandbox \
                     16-kg-rag-fusion 17-llm-observability \
                     18-agent-long-term-memory 19-voice-ai-assistant \
                     20-llm-eval-benchmark; do
            echo "::group::Compile $proj"
            if ! python -m compileall -q "$proj"; then
              echo "::warning::compile errors in $proj"
              failed="$failed $proj"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::compile errors in:$failed"
            exit 1
          fi

  test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-rag-knowledge-base
          - 02-agent-workflow
          - 03-multi-model-gateway
          - 04-guardrails-chat
          - 05-vector-db-manager
          - 06-lora-finetune
          - 07-code-review-agent
          - 09-multimodal-doc-understanding
          - 11-dify-workflow
          - 12-prompt-eval-framework
          - 14-mcp-tool-integration
          - 15-agent-security-sandbox
          - 16-kg-rag-fusion
          - 17-llm-observability
          - 18-agent-long-term-memory
          - 19-voice-ai-assistant
          - 20-llm-eval-benchmark
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Minimal set: the sub-projects only need the FastAPI and pytest surface to
          # import. torch and chromadb are excluded on purpose — they are gigabytes.
          pip install fastapi uvicorn pydantic httpx pytest pytest-asyncio \
                      numpy scikit-learn scipy rouge-score nltk python-multipart
          if [ -f requirements.txt ]; then
            grep -iE "^[a-zA-Z]" requirements.txt | \
              grep -viE "torch|chromadb|sentence-transformers|spacy|peft|trl|transformers|bitsandbytes|accelerate|restrictedpython|psutil" | \
              head -20 | xargs -r -I{} pip install {} || true
          fi
      - name: Run tests
        working-directory: ./${{ matrix.project }}
        shell: bash
        run: |
          # 09/18/19 need their default mock provider to start.
          export ALLOW_MOCK_PROVIDERS=true
          # The sandbox, gateway and guardrails have dev-mode auth bypasses.
          export SANDBOX_AUTH_DISABLED=true
          export GATEWAY_AUTH_DISABLED=true
          export GUARDRAILS_AUTH_DISABLED=true
          mkdir -p "$GITHUB_WORKSPACE/results"
          if [ ! -d tests ]; then
            echo "no tests/ directory"
            echo "no-tests" > "$GITHUB_WORKSPACE/results/${{ matrix.project }}.txt"
            exit 0
          fi
          set +e
          pytest tests/ -q --tb=short --continue-on-collection-errors --timeout=30
          echo "$?" > "$GITHUB_WORKSPACE/results/${{ matrix.project }}.txt"
      # Each matrix leg publishes its own result; the gate job pulls them all back.
      - name: Publish the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub-project-${{ matrix.project }}
          path: results/${{ matrix.project }}.txt
          if-no-files-found: error

  gate:
    name: Compare against the recorded baseline
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # download-artifact clears its target directory first, which would delete the
      # baseline that came from the checkout. Download beside it instead, then read
      # the baseline from the repository and the results from reports/.
      - uses: actions/download-artifact@v4
        with:
          pattern: sub-project-*
          merge-multiple: true
          path: reports
      - name: Diff against the baseline
        shell: bash
        run: |
          if [ ! -f results/baseline.txt ]; then
            echo "::error::results/baseline.txt is missing, so nothing can be compared"
            exit 1
          fi
          # What actually arrived, so a red gate says which files are missing.
          echo "--- results collected ---"
          ls -la reports/ || true
          echo "--- expected by the baseline ---"
          grep -vc '^#' results/baseline.txt
          failed=0
          while read -r project recorded; do
            [ -z "$project" ] && continue
            # Skip the comment lines the baseline file is allowed to carry.
            case "$project" in \#*) continue ;; esac
            file="reports/$project.txt"
            if [ ! -f "$file" ]; then
              echo "::error::$project produced no result file"
              failed=1
              continue
            fi
            code=$(cat "$file")
            if [ "$code" = "0" ] || [ "$code" = "no-tests" ]; then
              echo "ok       $project"
            elif [ "$recorded" = "failing" ]; then
              echo "known    $project — failing before this change too (see baseline.txt)"
            else
              echo "::error::$project regressed: baseline says '$recorded', this run failed"
              failed=1
            fi
          done < results/baseline.txt
          if [ "$failed" -ne 0 ]; then
            echo "::error::at least one sub-project regressed"
            exit 1
          fi
          echo "no sub-project regressed"