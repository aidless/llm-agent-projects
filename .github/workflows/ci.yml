# CI for llm-agent-projects
#
# The history of this file is worth two paragraphs, because both cost a lot of time.
#
# 1. The first draft was rejected by GitHub before it ran a single step:
#    `run: echo "Project ... status: ${{ job.status }}"` is a plain scalar whose value
#    contains ": ", so YAML reads it as a mapping. The run showed as failed with zero
#    jobs, which reads exactly like a broken test suite. It also swallowed every failure
#    with `|| echo "::warning::..."`, so it could not have failed on its own terms.
#
# 2. The second draft compared all seventeen sub-projects in one job. Seventeen of them
#    do have failing tests today, so the gate runs against results/baseline.txt rather
#    than failing on the first red one — but a single job reports only "the gate failed",
#    and the GitHub job log cannot be read without authentication, so there was no way
#    to learn *which* sub-project disagreed with the baseline. That is why this is a
#    matrix again: each leg's name carries its project, so a failing leg is identifiable
#    from the API alone.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Compile-check every sub-project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile
        shell: bash
        run: |
          # -e arrives from GitHub's `bash --noprofile --norc -eo pipefail`; this loop
          # collects every failure instead of stopping at the first.
          set +e
          set -uo pipefail
          failed=""
          for proj in 01-rag-knowledge-base 02-agent-workflow 03-multi-model-gateway \
                     04-guardrails-chat 05-vector-db-manager 06-lora-finetune \
                     07-code-review-agent 09-multimodal-doc-understanding \
                     11-dify-workflow 12-prompt-eval-framework \
                     14-mcp-tool-integration 15-agent-security-sandbox \
                     16-kg-rag-fusion 17-llm-observability \
                     18-agent-long-term-memory 19-voice-ai-assistant \
                     20-llm-eval-benchmark; do
            echo "::group::Compile $proj"
            if ! python -m compileall -q "$proj"; then
              echo "::warning::compile errors in $proj"
              failed="$failed $proj"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::compile errors in:$failed"
            exit 1
          fi

  verify:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-rag-knowledge-base
          - 02-agent-workflow
          - 03-multi-model-gateway
          - 04-guardrails-chat
          - 05-vector-db-manager
          - 06-lora-finetune
          - 07-code-review-agent
          - 09-multimodal-doc-understanding
          - 11-dify-workflow
          - 12-prompt-eval-framework
          - 14-mcp-tool-integration
          - 15-agent-security-sandbox
          - 16-kg-rag-fusion
          - 17-llm-observability
          - 18-agent-long-term-memory
          - 19-voice-ai-assistant
          - 20-llm-eval-benchmark
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip
          # Minimal import surface. torch and chromadb are gigabytes and no test here
          # needs them. pytest-timeout is not optional: without it pytest exits 4 on the
          # unrecognised --timeout flag.
          pip install -q fastapi uvicorn pydantic httpx pytest pytest-asyncio \
                      pytest-timeout numpy scikit-learn scipy rouge-score nltk \
                      python-multipart pillow requests
          if [ -f "${{ matrix.project }}/requirements.txt" ]; then
            reqs=$(grep -iE "^[a-zA-Z]" "${{ matrix.project }}/requirements.txt" | \
              grep -viE "torch|chromadb|sentence-transformers|spacy|peft|trl|transformers|bitsandbytes|accelerate|restrictedpython|psutil" | \
              head -20 || true)
            if [ -n "$reqs" ]; then
              echo "$reqs" | xargs -r -I{} pip install -q {} \
                || echo "::warning::some requirements for ${{ matrix.project }} did not install"
            fi
          fi
          exit 0
      - name: Run this sub-project's tests
        id: tests
        working-directory: ./${{ matrix.project }}
        shell: bash
        run: |
          # GitHub runs `shell: bash` as `bash --noprofile --norc -eo pipefail`, so -e is
          # already on before this line; a failing pip install or a single red test would
          # abort the step. It has to be switched off explicitly.
          set +e
          set -uo pipefail
          export ALLOW_MOCK_PROVIDERS=true
          export SANDBOX_AUTH_DISABLED=true
          export GATEWAY_AUTH_DISABLED=true
          export GUARDRAILS_AUTH_DISABLED=true
          if [ ! -d tests ]; then
            echo "no tests/ directory"
            echo "code=no-tests" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pytest tests/ -q --tb=short --continue-on-collection-errors --timeout=30
          code=$?
          echo "pytest exited $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Compare this sub-project against results/baseline.txt
        shell: bash
        run: |
          set +e
          set -uo pipefail
          project='${{ matrix.project }}'
          code='${{ steps.tests.outputs.code }}'
          baseline=results/baseline.txt
          if [ ! -f "$baseline" ]; then
            echo "::error::$baseline is missing, so nothing can be compared"
            exit 1
          fi
          if ! grep -qE "^$project " "$baseline"; then
            echo "::error::$project is not listed in results/baseline.txt"
            echo "::error::add a line '<project> green|failing' to say what is expected"
            exit 1
          fi
          recorded=$(grep -E "^$project " "$baseline" | awk '{print $2}')
          echo "recorded: $recorded, this run: $code"
          case "$code" in
            0|no-tests)
              # Passing is always fine, whether or not the baseline expected it. A
              # sub-project that has been fixed shows up here, and flipping its line to
              # "green" is what re-arms the gate for it.
              echo "ok: $project passes"
              ;;
            *)
              if [ "$recorded" = "failing" ]; then
                echo "::warning::$project is still failing, as recorded in the baseline"
              else
                echo "::error::$project regressed: the baseline records '$recorded'"
                exit 1
              fi
              ;;
          esac
